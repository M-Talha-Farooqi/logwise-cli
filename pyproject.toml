[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logwise"
version = "0.1.0"
description = "A resilient server-log analyzer for on-call engineers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "M. Talha Farooqi" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# THIS is what turns `logwise` into a runnable command after install.
[project.scripts]
logwise = "logwise.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/logwise"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
