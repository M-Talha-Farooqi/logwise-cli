name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q --cov=logwise --cov-report=term-missing
      - name: Smoke test the binary
        run: |
          python scripts/generate_logs.py --lines 2000 --seed 7 --out ci.log
          set +e
          logwise analyze ci.log
          rc=$?
          logwise analyze ci.log --format json > /dev/null
          rc_json=$?
          set -e
          if [ $rc -gt 1 ] || [ $rc_json -gt 1 ]; then
            echo "Unexpected exit code(s): $rc / $rc_json"
            exit 1
          fi
